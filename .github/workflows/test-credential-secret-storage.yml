name: 'Test: Connector Credential Secret Storage'

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/test-credential-secret-storage.yml'
      - 'durable-memory/**'
      - 'scripts/memory/**'
      - 'package.json'
      - 'packages/cli/test/integration/credentials/credential-secret-storage.test.ts'
      - 'packages/cli/src/credentials/**'
      - 'packages/cli/src/credentials-helper.ts'
      - 'packages/core/src/credentials.ts'
      - 'packages/core/src/encryption/**'
      - 'packages/@n8n/db/src/entities/credentials-entity.ts'
      - 'packages/@n8n/db/src/entities/shared-credentials.ts'
      - 'packages/@n8n/db/src/repositories/credentials.repository.ts'
      - 'packages/@n8n/db/src/repositories/shared-credentials.repository.ts'
      - 'packages/@n8n/db/src/repositories/credential-access.repository.ts'
  pull_request:
    paths:
      - '.github/workflows/test-credential-secret-storage.yml'
      - 'durable-memory/**'
      - 'scripts/memory/**'
      - 'package.json'
      - 'packages/cli/test/integration/credentials/credential-secret-storage.test.ts'
      - 'packages/cli/src/credentials/**'
      - 'packages/cli/src/credentials-helper.ts'
      - 'packages/core/src/credentials.ts'
      - 'packages/core/src/encryption/**'
      - 'packages/@n8n/db/src/entities/credentials-entity.ts'
      - 'packages/@n8n/db/src/entities/shared-credentials.ts'
      - 'packages/@n8n/db/src/repositories/credentials.repository.ts'
      - 'packages/@n8n/db/src/repositories/shared-credentials.repository.ts'
      - 'packages/@n8n/db/src/repositories/credential-access.repository.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    name: Durable memory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check durable memory
        run: bash scripts/memory/run.sh check durable-memory

  integration:
    name: Credential storage (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            test-script: test:sqlite
          - database: postgres
            test-script: test:postgres:integration:tc
            postgres-image: postgres:18.4-alpine
    env:
      TEST_IMAGE_POSTGRES: ${{ matrix.postgres-image || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup and build
        uses: ./.github/actions/setup-nodejs

      - name: Run credential storage integration tests
        shell: bash
        run: pnpm --filter=n8n run "${{ matrix.test-script }}" -- test/integration/credentials/credential-secret-storage.test.ts --maxWorkers=1
